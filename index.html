*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top,#16434b 0,#071a20 55%);color:var(--text);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:20px}.hero{text-align:center;padding:24px 8px}.hero h1{font-size:clamp(27px,5vw,46px);margin:0 0 10px}.hero p{color:var(--muted);margin:5px}.card{background:rgba(14,41,48,.96);border:1px solid #24535a;border-radius:22px;padding:22px;box-shadow:0 15px 40px #0007;margin-bottom:18px}.hidden{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #38636a;background:#092128;color:white;font-size:16px}button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#062019}.secondary{background:#23454c;color:white}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{background:#092128;border:1px solid #2b555c;border-radius:999px;padding:8px 12px;color:var(--muted)}.progress{height:12px;background:#092128;border-radius:20px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0}.q{font-size:22px;font-weight:800;line-height:1.35;margin:18px 0}.answers{display:grid;gap:10px}.ans{display:block;width:100%;text-align:left;background:#12343b;color:white;border:1px solid #31575e;padding:15px;border-radius:14px}.ans:hover{border-color:var(--accent);transform:translateY(-1px)}.ans.correct{background:#164d3c;border-color:var(--good)}.ans.wrong{background:#572a2d;border-color:var(--bad)}.feedback{margin-top:15px;padding:13px;border-radius:13px;background:#092128;color:#d8eee7}.footer-actions{display:flex;justify-content:flex-end;margin-top:15px}.score{font-size:64px;font-weight:900;color:var(--gold);text-align:center}.stars{text-align:center;font-size:36px}.review{border-top:1px solid #315057;padding:14px 0}.review b{display:block;margin-bottom:6px}.ok{color:var(--good)}.no{color:var(--bad)}.note{font-size:13px;color:var(--muted);margin-top:12px}@media(max-width:620px){.fields{grid-template-columns:1fr}.card{padding:16px}.q{font-size:19px}}

</head><body><div class="wrap">
<div class="hero"><h1>🧬 Асқорыту қауіпсіздігі</h1><p>Тамақтану гигиенасы • жұқпалы аурулар • улану • алғашқы жәрдем • ішек құрттары</p><p>30 тапсырмалық биология ойыны</p></div>
<section id="start" class="card"><h2>🎮 Ойынды бастау</h2><p>Әр дұрыс жауап — <b>10 ұпай</b>. Максимум: <b>300 ұпай</b>.</p><div class="fields"><input id="name" placeholder="Оқушының аты-жөні"><input id="className" placeholder="Сыныбы (мысалы, 8А)"></div><p class="note">Бір құрылғыдан бұл тестті қайта тапсыру шектеледі.</p><button class="primary" onclick="startGame()">Бастау →</button></section>
<section id="game" class="card hidden"><div class="topbar"><span class="pill" id="counter"></span><span class="pill" id="points"></span><span class="pill" id="level"></span></div><div class="progress"><i id="bar"></i></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><div class="footer-actions"><button id="next" class="primary hidden" onclick="nextQ()">Келесі →</button></div></section>

</div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwTje5hP3YdsIgpqGMW2obdEKYinNebnpT2a49m8odDLze5_NLmaAubBc4rY6Z62C5DKQ/exec';
const TEST_NAME='Тамақтану гигиенасы және асқорыту аурулары — 30 тапсырма';
const ATTEMPT_KEY='attempt_nutrition_hygiene_digestive_30_v1';
const questions=[
{q:'Тамақтану гигиенасының негізгі мақсаты қандай?',a:['Денсаулықты сақтайтын қауіпсіз әрі дұрыс тамақтануды ұйымдастыру','Тек тағамның дәмін жақсарту','Тек дене салмағын арттыру','Тамақты барынша ұзақ сақтау'],c:0,e:'Тамақтану гигиенасы тағамның қауіпсіздігі, сапасы және дұрыс тамақтану тәртібі арқылы денсаулықты қорғауға бағытталады.'},
{q:'Тамақ ішер алдында ең маңызды гигиеналық әрекет:',a:['Қолды сабынмен жуу','Суық су ішу','Тәтті жеу','Терезені ашу'],c:0,e:'Қол жуу нәжіс–ауыз жолымен таралатын көптеген қоздырғыштардың тағамға түсуін азайтады.'},
{q:'Шикі ет пен дайын тағамға бөлек тақтай қолданудың себебі неде?',a:['Айқаспалы ластануды болдырмау','Тағамды тез суыту','Дәмін күшейту','Калориясын азайту'],c:0,e:'Шикі еттегі микроағзалар дайын тағамға құралдар арқылы өтуі мүмкін; бұл айқаспалы ластану.'},
{q:'Жұқпалы ішек ауруларының жиі таралу жолы:',a:['Ластанған су мен тағам арқылы','Тек ауа арқылы','Тек тері арқылы','Тек тұқымқуалау арқылы'],c:0,e:'Көптеген ішек инфекциялары нәжіс–ауыз механизмімен, соның ішінде ластанған су және тағам арқылы таралады.'},
{q:'Дизентерия көбіне қай мүшелер жүйесін зақымдайды?',a:['Асқорыту жүйесін','Тыныс алу жүйесін','Қаңқа жүйесін','Сезім мүшелерін'],c:0,e:'Дизентерия — ішектің, әсіресе тоқ ішектің зақымдануымен жүретін жұқпалы ауру.'},
{q:'Ішек инфекциясының алдын алуда қай әрекет дұрыс?',a:['Қауіпсіз су пайдалану және қолды жуу','Жемісті жумай жеу','Шикі етті дайын тағаммен бірге сақтау','Сақтау мерзімін елемеу'],c:0,e:'Таза су, қол гигиенасы және тағам қауіпсіздігі инфекция қаупін төмендетеді.'},
{q:'Тағамнан уланудың ықтимал белгісін таңдаңыз.',a:['Жүрек айну, құсу, іш өту','Шаштың бірден ағаруы','Көрудің тұрақты жақсаруы','Бойдың жылдам өсуі'],c:0,e:'Жүрек айну, құсу, іштің ауыруы және іш өту тағамнан улануда жиі кездеседі.'},
{q:'Тағамның жарамдылық мерзімі өтіп кетсе не істеу керек?',a:['Тұтынбау','Қайта қыздырып міндетті түрде жеу','Иісін жасырып жеу','Басқа тағамға араластыру'],c:0,e:'Жарамдылық мерзімі өткен тағам қауіпсіз болмауы мүмкін, сондықтан оны тұтынбаған дұрыс.'},
{q:'Тоңазытқышта тағам сақтаудың негізгі пайдасы:',a:['Көптеген микроағзалардың көбеюін баяулатады','Барлық микробты бірден жояды','Тағамды стерильдейді','Уыттарды міндетті түрде жояды'],c:0,e:'Салқын температура микробтардың көбеюін баяулатады, бірақ барлық микроағзаны жоймайды.'},
{q:'Консерві банкасы ісінген болса, ең қауіпсіз шешім:',a:['Ашпай, тағамды тұтынбау','Дәмін аздап көру','Қайнатып жеу','Иісін тексеріп пайдалану'],c:0,e:'Ісінген банка микробтық бұзылудың белгісі болуы мүмкін. Мұндай өнімді дәмін татпай тастаған дұрыс.'},
{q:'Тағамнан уланған адамда ең қауіпті мәселелердің бірі:',a:['Сусыздану','Тырнақтың өсуі','Шаштың түсуі','Тістің түсі өзгеруі'],c:0,e:'Құсу мен іш өту кезінде ағза су мен электролиттерді жоғалтады.'},
{q:'Құсу және іш өту кезінде сұйықтық жоғалтуды азайту үшін не маңызды?',a:['Аз-аздан жиі сұйықтық/регидратациялық ерітінді беру','Мүлде су бермеу','Тек газды сусын беру','Өте майлы тамақ беру'],c:0,e:'Регидратация су мен тұздардың орнын толтыруға көмектеседі. Ауыр жағдайда медициналық көмек қажет.'},
{q:'Уланған адам есінен танып жатса, қай әрекет дұрыс емес?',a:['Аузына су немесе тағам құю','Жедел жәрдем шақыру','Тынысын бақылау','Қауіпсіз қалпын қамтамасыз ету'],c:0,e:'Ес-түссіз адамға ауыздан сұйықтық беру тұншығуға әкелуі мүмкін.'},
{q:'Тағамнан улану ауыр өтіп, тоқтаусыз құсу, әлсіздік байқалса:',a:['Медициналық көмекке жүгіну керек','Белгілерді елемеу керек','Міндетті түрде спортпен айналысу керек','Кездейсоқ антибиотик ішу керек'],c:0,e:'Ауыр симптомдарда дәрігер бағалауы қажет; өз бетінше антибиотик қабылдау дұрыс емес.'},
{q:'Гельминттер дегеніміз:',a:['Адам немесе жануар ағзасында паразиттік тіршілік ете алатын құрттар','Барлық пайдалы бактериялар','Вирустардың бір тобы','Асқорыту ферменттері'],c:0,e:'Гельминттер — паразит құрттардың жалпы атауы.'},
{q:'Ішек құрттарын жұқтыру қаупін төмендететін әрекет:',a:['Көкөніс пен жемісті мұқият жуу','Тырнақты тістеу','Қолды жумай тамақтану','Шала піскен етті жиі жеу'],c:0,e:'Өсімдік өнімдерін жуу және қол гигиенасы паразит жұмыртқаларының ауызға түсу қаупін азайтады.'},
{q:'Энтеробиоздың қоздырғышы:',a:['Үшкірқұрт (острица)','Аскарида','Сиыр цепені','Бауырсорғыш'],c:0,e:'Энтеробиозды Enterobius vermicularis — үшкірқұрт қоздырады.'},
{q:'Энтеробиозға тән белгі:',a:['Анус маңындағы, әсіресе түнгі қышыну','Тек жөтел','Құлақтың ауыруы','Сүйектің сынуы'],c:0,e:'Аналық үшкірқұрттар түнде анус маңына жұмыртқа салатындықтан қышыну пайда болуы мүмкін.'},
{q:'Аскариданың жұмыртқасы адам ағзасына көбіне қалай түседі?',a:['Ластанған қол, су немесе жуылмаған өнімдер арқылы ауыздан','Маса шағуы арқылы','Тек ауа арқылы','Тек қан құю арқылы'],c:0,e:'Аскаридозда жетілген жұмыртқалар ауыз арқылы жұтылады.'},
{q:'Гельминтоздың алдын алудың тиімді кешені:',a:['Қол жуу, тағамды өңдеу, таза су, етті толық пісіру','Тек витамин ішу','Тек маска тағу','Тек бөлмені желдету'],c:0,e:'Паразит түріне қарай жұғу жолдары әртүрлі, сондықтан бірнеше гигиеналық шараны қатар сақтау маңызды.'},
{q:'🧠 Күрделі: Бір отбасында шикі тауық тураған пышақпен салат туралды. Негізгі қауіп қандай?',a:['Айқаспалы микробтық ластану','Салаттағы витаминнің артуы','Тұздың азаюы','Судың булануы'],c:0,e:'Шикі құс етіндегі патогендер пышақ арқылы термиялық өңделмейтін салатқа өтуі мүмкін.'},
{q:'🧠 Күрделі: Құсу мен іш өту кезінде ағзада суға қоса қандай заттар жоғалады?',a:['Электролиттер','Тек нәруыз','Тек ДНҚ','Тек оттек'],c:0,e:'Натрий, калий және басқа электролиттердің жоғалуы су-тұз тепе-теңдігін бұзады.'},
{q:'🧠 Күрделі: Нәжіс–ауыз жұғу тізбегін үзуге ең тікелей әсер ететін жұп:',a:['Қол жуу + қауіпсіз ауызсу','Қалың киім + жаттығу','Ұйқы + музыка','Күннен қорғайтын крем + көзілдірік'],c:0,e:'Қол гигиенасы мен қауіпсіз су қоздырғыштың нәжістен ауызға жету жолын тікелей бөгейді.'},
{q:'🧠 Күрделі: Неліктен тағамды жақсылап пісіру қауіпсіздікті арттырады?',a:['Жеткілікті температура көптеген патогендерді жояды немесе азайтады','Барлық уыттарды міндетті түрде жояды','Тағамды мәңгі сақтайды','Барлық спораны кез келген жағдайда жояды'],c:0,e:'Термиялық өңдеу көптеген вегетативті микроағзаларды жояды, бірақ барлық токсиндер мен спораларға бірдей әсер етпейді.'},
{q:'🧠 Күрделі: Ботулизм қаупі көбіне қай жағдаймен байланысты болуы мүмкін?',a:['Дұрыс дайындалмаған герметикалық консервілер','Жаңа жуылған алма','Қайнатылған таза су','Жаңа піскен нан'],c:0,e:'Clostridium botulinum оттегі аз ортада өсе алады; дұрыс консервіленбеген өнімдер ерекше қауіп тудырады.'},
{q:'🧠 Күрделі: Ботулизмге күдік туғызатын белгі қайсы?',a:['Көрудің бұзылуы, жұтынудың қиындауы, бұлшықет әлсіздігі','Тек тізенің көгеруі','Тек тістің ауыруы','Тек мұрынның бітелуі'],c:0,e:'Ботулин нейротоксині жүйке-бұлшықет қызметін бұзады. Бұл — шұғыл медициналық жағдай.'},
{q:'🧠 Күрделі: Аскарида дернәсілдерінің адам ағзасындағы миграциясында қай мүше маңызды кезең болып табылады?',a:['Өкпе','Тек тоқ ішек','Қуық','Тері бездері'],c:0,e:'Дернәсілдер ішектен қан арқылы бауыр–жүрек–өкпе бағытымен өтіп, кейін қайта жұтылып ішекке жетеді.'},

let order=[],idx=0,score=0,records=[],locked=false,student={};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){let n=document.getElementById('name').value.trim(),cl=document.getElementById('className').value.trim();if(!n||!cl){alert('Аты-жөніңіз бен сыныбыңызды енгізіңіз.');return}if(localStorage.getItem(ATTEMPT_KEY)){if(!confirm('Бұл құрылғыда тест бұрын тапсырылған. Мұғалім рұқсат етсе ғана жалғастырыңыз. Жалғастыру керек пе?'))return}student={name:n,className:cl};order=shuffle(questions.map((q,i)=>({q,i})));document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){locked=false;let item=order[idx],q=item.q;document.getElementById('counter').textContent=`${idx+1} / ${questions.length}`;document.getElementById('points').textContent=`⭐ ${score} ұпай`;document.getElementById('level').textContent=idx<20?'Негізгі деңгей':idx<27?'Күрделі деңгей':'Олимпиада';document.getElementById('bar').style.width=((idx)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;document.getElementById('feedback').classList.add('hidden');document.getElementById('next').classList.add('hidden');let opts=shuffle(q.a.map((t,i)=>({t,i})));let box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='ans';b.textContent=o.t;b.onclick=()=>choose(o.i,b);box.appendChild(b)})}
function choose(chosen,btn){if(locked)return;locked=true;let q=order[idx].q,correct=chosen===q.c;if(correct){score+=10;btn.classList.add('correct')}else{btn.classList.add('wrong');[...document.querySelectorAll('.ans')].forEach(b=>{if(b.textContent===q.a[q.c])b.classList.add('correct')})}[...document.querySelectorAll('.ans')].forEach(b=>b.disabled=true);records.push({number:idx+1,question:q.q,studentAnswer:q.a[chosen],correctAnswer:q.a[q.c],isCorrect:correct});let f=document.getElementById('feedback');f.innerHTML=(correct?'✅ <b>Дұрыс!</b> ':'❌ <b>Қате.</b> ')+q.e;f.classList.remove('hidden');document.getElementById('points').textContent=`⭐ ${score} ұпай`;document.getElementById('next').textContent=idx===questions.length-1?'Нәтижені көру 🏆':'Келесі →';document.getElementById('next').classList.remove('hidden')}
function nextQ(){idx++;if(idx>=questions.length)finish();else render()}
function finish(){localStorage.setItem(ATTEMPT_KEY,new Date().toISOString());document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let correct=records.filter(x=>x.isCorrect).length,wrong=questions.length-correct,percent=Math.round(correct/questions.length*100);document.getElementById('score').textContent=score+'/300';document.getElementById('stars').textContent=percent>=90?'⭐⭐⭐':percent>=70?'⭐⭐':'⭐';document.getElementById('summary').innerHTML=`${student.name}, дұрыс жауап: <b>${correct}</b>, қате: <b>${wrong}</b>, нәтиже: <b>${percent}%</b>`;document.getElementById('review').innerHTML='<h3>📚 Жауаптарды талдау</h3>'+records.map(r=>`<div class="review"><b>${r.number}. ${r.question}</b><span class="${r.isCorrect?'ok':'no'}">Сіздің жауабыңыз: ${r.studentAnswer}</span>${r.isCorrect?'':`<br><span class="ok">Дұрыс жауап: ${r.correctAnswer}</span>`}</div>`).join('');sendResult({testName:TEST_NAME,name:student.name,className:student.className,score,maxScore:questions.length*10,correct,wrong,percent,answers:records})}
function sendResult(data){let s=document.getElementById('sendStatus');s.textContent='Нәтиже сақталуда...';fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(()=>s.textContent='✅ Нәтиже Google Sheets жүйесіне жіберілді.').catch(()=>s.textContent='⚠️ Нәтижені автоматты жіберу мүмкін болмады. Интернет байланысын тексеріңіз.')}
</script></body></html>
